[package]
edition.workspace = true
license.workspace = true
name = "agere-models-manager"
version.workspace = true

[lib]
doctest = false
name = "agere_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
agere-app-server-protocol = { workspace = true }
agere-login = { workspace = true }
agere-otel = { workspace = true }
agere-protocol = { workspace = true }
agere-utils-common = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
agere-config = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
