[package]
edition.workspace = true
license.workspace = true
name = "agere-model-provider"
version.workspace = true

[lib]
doctest = false
name = "agere_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
agere-api = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
agere-client = { workspace = true }
agere-config = { path = "../config" }
agere-feedback = { workspace = true }
agere-login = { workspace = true }
agere-model-provider-info = { workspace = true }
agere-models-manager = { workspace = true }
agere-otel = { workspace = true }
agere-protocol = { workspace = true }
agere-response-debug-context = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
