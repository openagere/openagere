[package]
name = "agere-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "agere-exec"
path = "src/main.rs"

[[bin]]
name = "agere-linux-helper"
path = "src/bin/agere_linux_helper.rs"

[lib]
name = "agere_exec"
path = "src/lib.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
agere-arg0 = { workspace = true }
agere-app-server-client = { workspace = true }
agere-app-server-protocol = { workspace = true }
agere-config = { workspace = true }
agere-core = { workspace = true }
agere-feedback = { workspace = true }
agere-git-utils = { workspace = true }
agere-login = { workspace = true }
agere-model-provider-info = { workspace = true }
agere-otel = { workspace = true }
agere-protocol = { workspace = true }
agere-utils-fs = { workspace = true }
agere-utils-cli = { workspace = true }
owo-colors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ts-rs = { workspace = true, features = [
    "uuid-impl",
    "serde-json-impl",
    "no-serde-warnings",
] }
uuid = { workspace = true }


[dev-dependencies]
assert_cmd = { workspace = true }
agere-apply-patch = { workspace = true }
agere-utils-cargo-bin = { workspace = true }

core_test_support = { workspace = true }
libc = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tracing-opentelemetry = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
wiremock = { workspace = true }
